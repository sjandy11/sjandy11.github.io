        function changeColor() {
            let h1El = document.querySelector(".my-title");
            if (h1El.style.color == "red") {
                h1El.style.color = "purple";
            } else {
                h1El.style.color = "red";
            }
        }
    </script>
</head>
<body>
    <button class="button" onclick="changeColor()">color</button>
